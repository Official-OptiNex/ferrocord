[package]
name = "ferro-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ferro-core = { version = "0.1.0", path = "../ferro-core" }
ferro-plugin-api = { version = "0.1.0", path = "../ferro-plugin-api" }
serde_json = "1.0.154"

[[bin]]
name = "ferrocord"
path = "src/main.rs"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.27.0"
