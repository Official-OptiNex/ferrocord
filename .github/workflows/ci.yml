name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Build loader and examples
        run: |
          cargo build --workspace
          cargo build --workspace --examples
      - name: End-to-end test
        run: cargo test -p ferro-launcher --test e2e -- --ignored
      - name: Build SDK and example plugin for WebAssembly
        run: |
          cargo build -p ferrocord-sdk --target wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown --manifest-path examples/hello-plugin/Cargo.toml
