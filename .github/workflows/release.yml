name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "ferrocord-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path "$dir/examples/hello-plugin" | Out-Null
          Copy-Item target/release/ferrocord.exe, target/release/ferro_loader.dll, README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Copy-Item examples/hello-plugin/manifest.json, examples/hello-plugin/plugin.wasm "$dir/examples/hello-plugin"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="ferrocord-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "$dir/examples/hello-plugin"
          cp target/release/ferrocord target/release/libferro_loader.so README.md LICENSE-MIT LICENSE-APACHE "$dir"
          cp examples/hello-plugin/manifest.json examples/hello-plugin/plugin.wasm "$dir/examples/hello-plugin"
          tar czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ferrocord-*.*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ferrocord-*
          generate_release_notes: true
